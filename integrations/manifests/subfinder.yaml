manifest_version: "1.0"

tool_id: subfinder
name: Subfinder
version: "1.0.0"
description: Passive subdomain enumeration using configured sources.

runtime:
  type: container
  image: "projectdiscovery/subfinder@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  entrypoint:
    - "-d"
    - "{{target}}"
  timeout_seconds: 300
  memory_mb: 512
  cpus: 1.0
  read_only_rootfs: true
  network_access: scoped_targets_only

capabilities:
  - subdomain_enumeration
  - passive_reconnaissance

operations:
  enumerate:
    description: Enumerate subdomains for a domain.
    parameters:
      target:
        type: string
        description: Domain to enumerate.
        required: true

output_format: json
output_schema_version: "1.0"
